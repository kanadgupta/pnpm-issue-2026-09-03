name: pnpm install

on:
  push:
  workflow_dispatch:

jobs:
  install:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        pnpm: ["11.25.0", "12.3.1"]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    name: pnpm ${{ matrix.pnpm }} on ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          version: ${{ matrix.pnpm }}
          install: false
      - name: Show line endings of the patch file
        shell: bash
        # Prints 8 (one CRLF per line). Uses node rather than grep because
        # MSYS grep on Windows strips the CR before matching.
        run: |
          pnpm --version
          node -e "const s=require('fs').readFileSync('patches/is-odd@3.0.1.patch','latin1');const n=(s.match(/\r\n/g)||[]).length;console.log(n);process.exit(n===8?0:1)"
      - name: pnpm install
        shell: bash
        run: pnpm install --no-frozen-lockfile
      - name: Verify the patch was applied
        shell: bash
        run: grep 'patched by pnpm-issue-2026-09-03' node_modules/is-odd/index.js
