name: pnpm install

on:
  push:
  workflow_dispatch:

jobs:
  install:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        pnpm: ["11.25.0", "12.3.4"]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    name: pnpm ${{ matrix.pnpm }} on ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          version: ${{ matrix.pnpm }}
          install: false
      - name: Show line endings of both patch files
        shell: bash
        # Prints 0 for lf/ and 8 for crlf/. Uses node rather than grep because
        # MSYS grep on Windows strips the CR before matching.
        run: |
          pnpm --version
          for d in lf crlf; do node -e "const s=require('fs').readFileSync('$d/patches/is-odd@3.0.1.patch','latin1');console.log('$d:',(s.match(/\r\n/g)||[]).length)"; done
      - name: pnpm install (LF patch)
        shell: bash
        working-directory: lf
        run: pnpm install --no-frozen-lockfile && grep 'patched by' node_modules/is-odd/index.js
      - name: pnpm install (CRLF patch)
        shell: bash
        working-directory: crlf
        run: pnpm install --no-frozen-lockfile && grep 'patched by' node_modules/is-odd/index.js
